# Use one of the two configurations, either yml or properties.

spring:
    application:
        name: taskmanager
    profiles:
        active: dev

    # Database Configuration
    datasource:
        url: jdbc:h2:mem:taskdb
        driverClassName: org.h2.Driver
        username: mamad
        password: mamad

    # JPA Configuration
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true

# App info
app:
    name: Task Manager
    version: 1.0.0
    max-tasks-per-page: 10

api:
    version: v1