spring.application.name=taskmanager

api.version=v1

# H2 DB Configuration
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=mamad
spring.datasource.password=mamad

# JPA Configuration
#? This is the dialect for the H2 database. Usually for Spring Boot version < 4.0.0
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#? This is the auto-generation of the database schema and it's good for learning, for prod we use migrations.
spring.jpa.hibernate.ddl-auto=update
#? This is the SQL logging and it's good for learning, for prod we use logging frameworks like SLF4J.
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console