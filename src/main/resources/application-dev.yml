# Use one of the two configurations, either yml or properties.

spring:
    application:
        name: taskmanager

    # Database Configuration
    datasource:
        url: jdbc:h2:mem:taskdb
        driverClassName: org.h2.Driver
        username: mamad
        password: mamad

    # JPA Configuration
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true

    # H2 Console Configuration
    h2:
        console:
            enabled: true
            path: /h2-console

# Actuator Configuration
management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics, env, logger, beans, mappings
            base-path: /actuator
    
    health:
        show-details: always
    info:
        env:
            enabled: true
info:
    app:
        description: "Task Manager CRUD API"
        version: "1.0.0"
        author: "Mohammad Farhadi"
        